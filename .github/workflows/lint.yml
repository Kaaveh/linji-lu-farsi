name: lint

# Deliberately does not use the container. The checkers need Python and two
# small wheels; pulling a multi-gigabyte TeX image to run a two-second lint
# would make every PR slower for no benefit. build.yml uses the container,
# which is where it earns its keep.
#
# The checkers are the bargardan-tools package, installed from its own public
# repository by tools/requirements.txt and pinned to a tag. A fork's pull
# request lints with no access to anything private: the package repo is public
# and nothing here reaches the maintainer's machine.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checkers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - run: pip install -r tools/requirements.txt

      # Only the adapter. The checkers' own suite runs in bargardan-tools' CI,
      # where it can prove what matters about it -- that it passes with none of
      # any book's config present.
      - name: Tests for the note-apparatus adapter
        run: python -m unittest discover -s tools/tests

      # Each on its own step so a red run names the failing check in the UI.
      - name: Orthography
        run: python -m bargardan_tools.normalize --check

      - name: Semantic line breaks
        run: python -m bargardan_tools.check_linebreaks --check

      # Exits 0 with a notice here: source/ is licensed to the maintainer for
      # translation, not for redistribution, so CI never has it. This step is
      # kept so the notice appears in the log and nobody assumes it ran.
      - name: Parity
        run: python -m bargardan_tools.check_parity --check

      - name: Note anchors
        run: python tools/anchors.py --check

  # There is no `spelling` job. It was written to install `hunspell-fa`, which
  # is in neither Debian nor Ubuntu -- no distribution packages a Persian
  # hunspell dictionary -- so the job failed on the package installation on
  # every run and never once reached a `.md` file. The same package in the
  # Dockerfile is why the container was never published, which is why `build`
  # and `release` had never run either.
  #
  # tools/dict/project.dic is kept. To bring the check back, vendor a Persian
  # dictionary into the repository and point hunspell at it by path
  # (`-d path/to/fa_IR,en_US`), rather than expecting apt to supply one.

  dco:
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Inbound equals outbound. Every commit needs `git commit -s`.
      - name: Every commit is signed off
        run: |
          base='${{ github.event.pull_request.base.sha }}'
          head='${{ github.event.pull_request.head.sha }}'
          missing=0
          while read -r sha; do
            if ! git log -1 --format='%B' "$sha" | grep -qi '^Signed-off-by: .\+ <.\+@.\+>'; then
              echo "missing Signed-off-by: $(git log -1 --format='%h %s' "$sha")"
              missing=1
            fi
          done < <(git rev-list "$base..$head")
          if [ "$missing" -ne 0 ]; then
            echo
            echo "Sign off with: git commit -s   (or: git rebase --signoff $base)"
            exit 1
          fi
          echo "dco: all commits signed off"
