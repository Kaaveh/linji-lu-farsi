name: release

# Tagging is what produces a citable edition. MAJOR is a new edition or a
# retranslation, MINOR is a new chapter or a substantive revision, PATCH is
# typos and orthography. See the README.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # The image belongs to a private repository; pulling it needs authentication,
  # and an explicit permissions block grants nothing it does not name.
  packages: read

jobs:
  release:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/kaaveh/linji-lu-farsi:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # A release must be reproducible from a clean tree, so no build cache
      # here even though it would be faster.
      - name: Render
        run: quarto render

      # Second PDF pass, phone page size. Separate output tree, so it cannot
      # disturb anything the previous step produced.
      - name: Render the mobile PDF
        run: quarto render --profile mobile --to pdf

      - name: Name the artefacts after the tag
        id: name
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp _book/*.pdf  "dist/linji-lu-farsi-${version}.pdf"
          cp _book/*.epub "dist/linji-lu-farsi-${version}.epub"
          cp _book-mobile/*.pdf "dist/linji-lu-farsi-${version}-mobile.pdf"

          # The whole rendered site, for kaavehdev.ir to unpack into
          # public/translations/linji-lu/. Cloudflare Workers Builds has no
          # Quarto, so the site cannot render this itself -- it fetches this
          # tarball at build time, pinned to a version it names explicitly.
          #
          # The PDF and EPUB stay inside the tarball as well as being attached
          # separately: the book's own download buttons link to them by
          # relative path, and would 404 without them.
          tar -czf "dist/linji-lu-farsi-${version}-html.tar.gz" -C _book .
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      # Quarto emits only relative asset paths and a relative
      # <meta name="quarto:offset">, so the bundle is relocatable. Assert it,
      # because a future Quarto version that emits root-absolute paths would
      # break the site silently and only in production.
      - name: Bundle is relocatable
        run: |
          if grep -rohE '(href|src)="/[^"]*"' _book --include='*.html' | grep -q .; then
            echo "Root-absolute asset paths found; this will break under /translations/linji-lu/:"
            grep -rohE '(href|src)="/[^"]*"' _book --include='*.html' | sort -u | head
            exit 1
          fi
          echo "all asset paths are relative"

      # Quarto reuses a chapter's heading verbatim for the sidebar and for
      # <title>, and neither gets the inline processing the page body gets. A
      # heading carrying a note marker therefore ships as raw Markdown in the
      # nav of all 76 pages, and bidi scrambles it on screen. The nav is where
      # it always shows, so one grep covers it; see tools/anchors.py.
      - name: No Markdown leaks into the sidebar
        run: |
          if grep -rohE '</a>[^<]*\[\^[^]]*\]\([^)]*\)' _book --include='*.html' | grep -q .; then
            echo "Raw Markdown in the sidebar; a chapter heading is carrying inline markup:"
            grep -rohE '</a>[^<]*\[\^[^]]*\]\([^)]*\)' _book --include='*.html' | sort -u | head
            exit 1
          fi
          echo "no Markdown in the sidebar"

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/linji-lu-farsi-${{ steps.name.outputs.version }}.pdf
            dist/linji-lu-farsi-${{ steps.name.outputs.version }}-mobile.pdf
            dist/linji-lu-farsi-${{ steps.name.outputs.version }}.epub
            dist/linji-lu-farsi-${{ steps.name.outputs.version }}-html.tar.gz
          generate_release_notes: true
          body: |
            The Persian translation is licensed CC BY-SA 4.0; the repository
            tooling is MIT. The English source text is not redistributed here
            and remains under its own copyright.
