# Configuration for the checkers in linji_tools/. This file is config only --
# they are imported from the tree, not installed. Their dependencies:
#   pip install -r tools/requirements.txt
#
# Everything below is what makes general checkers run on *this* book. The
# checkers themselves must work with none of it present; spec 010 has the why.

# ---------------------------------------------------------------------------
# [tool.book] is this project's own data, shared by whichever checkers need it.
# The checkers themselves are general; everything here is what makes them run
# on *this* book. [tool.<checker>] sections below tune one checker each.
# ---------------------------------------------------------------------------

[tool.book]

# Files in source/ that are not part of the book -- the maintainer's own index
# and provenance note. make_stubs.py writes no stub for these, and
# check_parity.py and anchors.py do not look for a translation of them.
exclude = ["README.md"]

# Persian headings for the six files that are not numbered sections. Book data,
# so it lives here rather than inside a checker: make_stubs.py puts these in a
# new stub, anchors.py renders the source heading into this form, and neither
# module has to carry the book's own vocabulary to do it.
#
# Generic Persian names for document parts, not translations of anything in the
# book. make_stubs.py --titles overrides them from a TSV.
[tool.book.titles]
"preface.md" = "پیش‌گفتار"
"translators-introduction.md" = "مقدمهٔ مترجم"
"ma-fang-preface.md" = "دیباچهٔ ما فانگ"
"record-title-page.md" = "صفحهٔ عنوان"
"appendix.md" = "پیوست"
"glossary.md" = "واژه‌نامه"

# Every normalization rule is individually toggleable. Turning one off here
# disables it for both --check and --fix, repo-wide. To exempt a region of a
# single file instead, wrap it in:
#   <!-- normalize: off -->
#   ...
#   <!-- normalize: on -->
[tool.normalize]

# Arabic Yeh U+064A -> Farsi Yeh U+06CC
arabic_yeh = true

# Arabic Kaf U+0643 -> Keheh U+06A9
arabic_kaf = true

# Arabic-Indic digits U+0660-U+0669 -> Extended Arabic-Indic U+06F0-U+06F9
arabic_digits = true

# Latin digits 0-9 -> Persian U+06F0-U+06F9.
# Off by default: the source carries Latin-digit years and Taisho numbers that
# should stay Latin, and note back-links are anchors, not prose. Turn on only
# if STYLE.md settles on Persian digits everywhere.
latin_digits = false

# Strip Tatweel / Kashida U+0640
tatweel = true

# ASCII , ; ? adjacent to Persian text -> U+060C U+061B U+061F
punctuation = true

# ZWNJ (U+200C) discipline
zwnj_mi = true          # mi/nemi verbal prefix + space + verb -> ZWNJ
zwnj_plural = true      # plural haa written as a separate word -> ZWNJ
zwnj_comparative = true # comparative tar / superlative tarin -> ZWNJ
zwnj_collapse = true    # collapse repeated ZWNJ
zwnj_trim = true        # drop ZWNJ next to a space or at a word boundary

# Straight and curly ASCII quotes -> Persian guillemets
quotes = true

# Diacritics / harakat U+064B-U+0652.
# "preserve" (default) leaves them alone; they carry meaning in poetry and in
# quoted scripture. "strip" removes them.
harakat = "preserve"

# Bidi overrides U+202A-U+202E and U+2066-U+2069 are always an error and are
# never auto-fixed, because they can make a diff display in a different order
# than it is stored. Not toggleable by design.

# ---------------------------------------------------------------------------

# Abbreviations whose trailing period does not end a sentence, on top of the
# general English set check_linebreaks.py carries. These are this book's: the
# language tags its notes cite sources in -- "Ch." for Chinese, "Skt." for
# Sanskrit, and so on. Without them every citation starts a spurious new line.
[tool.linebreaks]
abbreviations = ["Ch", "Skt", "J", "Chin", "Jpn", "Kor", "Pkt", "Pali", "Tib", "Sk"]
