# fa-IR, not fa. Quarto's relative-path rewriter treats a bare `fa` as a path
# because a directory of that name exists, and emits lang="../fa" on every
# page under fa/. A region subtag sidesteps it, and pandoc still maps fa-IR to
# babel's `persian` for the PDF.
lang: fa-IR
dir: rtl

# Quarto has no built-in fa locale. Without this every piece of chrome renders
# in English inside a Persian book. See the file header.
language: _language.yml

# Off deliberately. The section number is already the heading text -- fa/42.md
# opens with "# ۴۲" -- so Quarto's own numbering would render "۴۲ ۴۲".
number-sections: false

format:
  html:
    theme: cosmo
    css: assets/rtl.css
    toc: true
    # 2, not 1. Quarto puts the "Edit this page" link in the margin beside
    # the page TOC, and falls back to the footer when there is no TOC at all.
    # At depth 1 no chapter has a TOC, so the single most useful link in the
    # book ends up below the fold on every page.
    toc-depth: 2
    toc-title: "در این بخش"
    link-external-newwindow: true

  pdf:
    # LuaLaTeX, not XeLaTeX. See tex/preamble.tex for why -- under XeLaTeX
    # pandoc picks babel with bidi=default, which reverses Latin-script runs
    # embedded in Persian text.
    pdf-engine: lualatex
    documentclass: book
    # 1, so the printed contents lists sections only. Every section ends in a
    # `## یادداشت‌ها`, and at the default depth each one got its own dotted
    # line under its section -- 65 entries of the same word.
    toc-depth: 1
    # `openany`, not the book class's default `openright`. Under openright every
    # \chapter does a \cleardoublepage to start on a recto, and 75 of this book's
    # sections are a page or less -- Part Three averages 170 words -- so each one
    # left an empty verso behind it. Measured: 61 of 200 pages were blank but for
    # a page number. Two-sided layout and the asymmetric binding margins below
    # are unaffected; only the forced recto start goes.
    classoption: [openany]
    mainfont: "Vazirmatn-Regular.ttf"
    mainfontoptions:
      - Path=fonts/
      - BoldFont=Vazirmatn-Bold.ttf
      - Renderer=Harfbuzz
    fontsize: 12pt
    geometry:
      - top=25mm
      - bottom=25mm
      - inner=28mm
      - outer=22mm
    include-in-header: tex/preamble.tex
    # Stock title block plus one line: the version above the date. See the file.
    template-partials:
      - tex/title.tex
    colorlinks: true

  epub:
    # Pandoc supports this but does not derive it from `dir`, so an RTL book
    # otherwise ships with a left-to-right spine and pages turn the wrong way.
    page-progression-direction: rtl
    # Vendored so the book reads correctly on devices with no Persian font.
    epub-fonts:
      - fonts/Vazirmatn-Regular.ttf
      - fonts/Vazirmatn-Bold.ttf
    css: assets/epub.css
    toc-depth: 1
