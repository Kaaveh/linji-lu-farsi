# Book build. One source tree, three outputs.
#
# TBD markers below are the maintainer's calls, not defaults to keep: the book
# title, the author credit, and the four part titles are translation decisions
# and should be settled the same way any other term is.

# The one place the version is written. Bump it here, then tag the commit to
# match -- `git tag -a v0.0.1`. Semantics: MAJOR is a new edition, MINOR is
# content landing, PATCH is corrections. 1.0.0 is all 75 sections translated
# and read in the typeset PDF.
#
# Read by tex/title.tex for the PDF title page, and by index.md via
# `{{< meta book-version >}}` for HTML and EPUB, which have no title-page slot.
# Top-level rather than under `book:` so pandoc exposes it to the LaTeX
# template as a plain $book-version$ variable.
book-version: "نسخهٔ ۰.۰.۲"

# The edition's date, Jalali, written out. Bump it with the version above, in
# the same commit.
#
# Not `book: date:`. Quarto parses that key as a Gregorian date and reformats
# it -- a Jalali string comes back out as "Invalid Date", and there is no
# date-format that would produce one, because the whole date machinery is
# Gregorian. `today` was also the wrong fact: a title page dates the edition,
# not the afternoon someone ran the build. Same top-level treatment as
# book-version, and read the same two ways.
book-date: "۲۵ شهریور ۱۴۰۵"

project:
  type: book
  output-dir: _book

book:
  title: "آموزه‌های ذن استاد لین‌چی"        # TBD
  subtitle: "برگردان فارسی از متن انگلیسی برتون واتسون"   # TBD
  author: "کاوه"                             # TBD: how you want to be credited
  # No `date:` here -- see book-date at the top of this file.

  repo-url: https://github.com/Kaaveh/linji-lu-farsi
  repo-branch: main
  # `edit` is the one that matters. It turns a typo into a web-editor commit
  # with no clone, and produces more fixes than every other channel combined.
  repo-actions: [edit, issue]
  downloads: [pdf, epub]
  search: true

  sidebar:
    style: docked
    # 69 numbered sections make an unusably long nav if every part is open.
    # Collapsed, the sidebar is six entries and the page stops being as tall
    # as the navigation.
    collapse-level: 1

  chapters:
    - index.md
    - fa/preface.md
    - fa/translators-introduction.md
    - fa/ma-fang-preface.md
    - fa/record-title-page.md
